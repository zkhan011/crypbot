name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: cd backend && pip install -e .
      - run: cd backend && ruff format --check .
      - run: cd backend && ruff check .
      - run: python scripts/check_no_secrets.py
      - run: python scripts/validate_bingx_registry.py
      - run: python scripts/validate_bingx_config.py
      - run: python scripts/bingx_demo_certify.py --output /tmp/bingx-demo-certification.json
      - run: cd backend && mypy app
      - run: cd backend && pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
      - run: cd frontend && npm test
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
